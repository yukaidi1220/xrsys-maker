name: 系统环境探测

on:
  workflow_dispatch:
    inputs:
      run_speedtest:
        description: "是否运行网络测速"
        required: false
        default: false
        type: boolean

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: 测试计时函数
        shell: pwsh
        run: |
          # 计时器
          $script:StepTimers = @{}

          # 监控函数：输出系统状态和耗时
          function Write-Status {
            param(
              [string]$Step,
              [string]$Status
            )
            $time = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'China Standard Time').ToString('yyyy-MM-dd HH:mm:ss')
            $os = Get-CimInstance Win32_OperatingSystem
            $totalMem = [math]::Round((Get-CimInstance Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum).Sum / 1GB, 2)
            $freeMem = [math]::Round($os.FreePhysicalMemory / 1MB, 2)
            $usedMem = [math]::Round($totalMem - $freeMem, 2)
            $memPercent = [math]::Round(($usedMem / $totalMem) * 100, 1)

            $cDrive = Get-Volume -DriveLetter C -ErrorAction SilentlyContinue
            $dDrive = Get-Volume -DriveLetter D -ErrorAction SilentlyContinue
            $cFree = if ($cDrive) { [math]::Round($cDrive.SizeRemaining / 1GB, 2) } else { "N/A" }
            $dFree = if ($dDrive) { [math]::Round($dDrive.SizeRemaining / 1GB, 2) } else { "N/A" }

            # 计时逻辑
            $duration = ""
            if ($Status -eq "开始") {
              $script:StepTimers[$Step] = [DateTime]::UtcNow
            } elseif ($Status -eq "完成" -and $script:StepTimers.ContainsKey($Step)) {
              $elapsed = [DateTime]::UtcNow - $script:StepTimers[$Step]
              $duration = " | 耗时: {0:hh\:mm\:ss}" -f $elapsed
              $script:StepTimers.Remove($Step)
            }

            Write-Host ""
            Write-Host "========================================" -ForegroundColor Cyan
            Write-Host "[$time] $Step - $Status$duration" -ForegroundColor Yellow
            Write-Host "内存: ${usedMem}/${totalMem} GB (${memPercent}%)" -ForegroundColor White
            Write-Host "C盘可用: ${cFree} GB | D盘可用: ${dFree} GB" -ForegroundColor White
            Write-Host "========================================" -ForegroundColor Cyan
            Write-Host ""
          }

          # 测试
          Write-Status -Step "测试任务1" -Status "开始"
          Start-Sleep -Seconds 3
          Write-Status -Step "测试任务1" -Status "完成"

          Write-Status -Step "测试任务2" -Status "开始"
          Start-Sleep -Seconds 5
          Write-Status -Step "测试任务2" -Status "完成"

      - name: 测试 wimlib 日志限速
        shell: pwsh
        run: |
          # wimlib 日志限速输出函数
          function Invoke-Wimlib {
            param(
              [string]$FilePath,
              [string[]]$Arguments
            )

            $rateLimitedPatterns = @(
              'Creating files',
              'Extracting file data',
              'Applying metadata to files',
              'MiB scanned',
              'Archiving file data'
            )

            $lastOutputTime = [DateTime]::MinValue
            $lastMonitorTime = [DateTime]::MinValue
            $logFile = ".\wimlib_temp.log"
            $readPosition = 0

            $process = Start-Process -FilePath $FilePath -ArgumentList $Arguments -PassThru -NoNewWindow -RedirectStandardOutput $logFile

            while (!$process.HasExited) {
              Start-Sleep -Milliseconds 100
              if (Test-Path $logFile) {
                $stream = [System.IO.File]::Open($logFile, 'Open', 'Read', 'ReadWrite')
                $reader = New-Object System.IO.StreamReader($stream)
                $stream.Seek($readPosition, 'Begin') | Out-Null

                while ($null -ne ($line = $reader.ReadLine())) {
                  $readPosition = $stream.Position
                  $shouldRateLimit = $false
                  foreach ($pattern in $rateLimitedPatterns) {
                    if ($line -match [regex]::Escape($pattern)) {
                      $shouldRateLimit = $true
                      break
                    }
                  }

                  if ($shouldRateLimit) {
                    $now = [DateTime]::UtcNow
                    if (($now - $lastOutputTime).TotalSeconds -ge 15) {
                      Write-Host $line
                      $lastOutputTime = $now
                    }
                  } else {
                    Write-Host $line
                  }
                }

                $reader.Close()
                $stream.Close()
              }

              # 每30秒输出 CPU 和内存占用
              $now = [DateTime]::UtcNow
              if (($now - $lastMonitorTime).TotalSeconds -ge 30) {
                $lastMonitorTime = $now
                $cpu = (Get-CimInstance Win32_Processor).LoadPercentage
                $os = Get-CimInstance Win32_OperatingSystem
                $totalMem = [math]::Round((Get-CimInstance Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum).Sum / 1GB, 2)
                $freeMem = [math]::Round($os.FreePhysicalMemory / 1MB, 2)
                $usedMem = [math]::Round($totalMem - $freeMem, 2)
                $memPercent = [math]::Round(($usedMem / $totalMem) * 100, 1)
                Write-Host "[资源监控] CPU: ${cpu}% | 内存: ${usedMem}/${totalMem} GB (${memPercent}%)" -ForegroundColor DarkGray
              }
            }

            # 输出剩余内容
            if (Test-Path $logFile) {
              $stream = [System.IO.File]::Open($logFile, 'Open', 'Read', 'ReadWrite')
              $reader = New-Object System.IO.StreamReader($stream)
              $stream.Seek($readPosition, 'Begin') | Out-Null
              while ($null -ne ($line = $reader.ReadLine())) {
                Write-Host $line
              }
              $reader.Close()
              $stream.Close()
              Remove-Item $logFile -ErrorAction SilentlyContinue
            }

            return $process.ExitCode
          }

          # 创建模拟脚本：快速输出大量日志（持续约40秒）
          $mockScript = @'
          for ($i = 1; $i -le 20; $i++) {
            Write-Output "Creating files [$i/20]..."
            Start-Sleep -Milliseconds 500
          }
          Write-Output "Processing normal log line 1"
          for ($i = 1; $i -le 10; $i++) {
            Write-Output "Extracting file data [$i/10]..."
            Start-Sleep -Milliseconds 500
          }
          Write-Output "Processing normal log line 2"
          Write-Output "Applying metadata to files..."
          Write-Output "MiB scanned 1024"
          Write-Output "Archiving file data..."
          for ($i = 1; $i -le 20; $i++) {
            Write-Output "Extracting file data [$i/20]..."
            Start-Sleep -Milliseconds 300
          }
          Write-Output "Done!"
          '@

          Set-Content -Path ".\mock_wimlib.ps1" -Value $mockScript

          Write-Host "=== 测试 wimlib 日志限速 ==="
          Write-Host "预期：关键词行每15秒输出一次，普通行直接输出"
          Write-Host ""

          Invoke-Wimlib -FilePath "pwsh" -Arguments @("-File", ".\mock_wimlib.ps1")

          Remove-Item ".\mock_wimlib.ps1" -ErrorAction SilentlyContinue

      - name: 测试 BAT 中文编码
        shell: pwsh
        run: |
          # 创建测试 BAT 文件（GBK 编码，CR+LF）
          $lines = @(
            '@echo off'
            'chcp 65001 >nul'
            'echo === 测试中文输出 ==='
            'echo 这是第一行中文'
            'echo 正在处理文件...'
            'echo 完成！'
            'echo === 测试结束 ==='
          )
          $batContent = $lines -join "`r`n"

          # 使用 GBK 编码（代码页 936）
          $gbk = [System.Text.Encoding]::GetEncoding(936)
          [System.IO.File]::WriteAllText(".\test.bat", $batContent, $gbk)

          Write-Host "=== 测试 cmd.exe 调用 BAT 中文输出 ==="
          Write-Host ""

          # 直接调用，不做编码处理
          cmd.exe /c ".\test.bat"

          Write-Host ""
          Write-Host "=== 测试完成 ==="

          Remove-Item ".\test.bat" -ErrorAction SilentlyContinue

      - name: 查看网络信息
        shell: pwsh
        run: |
          Write-Host "=== 网络信息 ==="

          # Azure IMDS 获取区域
          try {
            $metadata = Invoke-RestMethod -Headers @{"Metadata"="true"} -Uri "http://169.254.169.254/metadata/instance?api-version=2021-02-01" -TimeoutSec 2
            Write-Host "Azure 区域: $($metadata.compute.location)"
            Write-Host "VM 大小: $($metadata.compute.vmSize)"
          } catch {
            Write-Host "Azure 区域: 不可用"
          }

          # 获取 IPv4
          try {
            $ipv4 = (Invoke-WebRequest -Uri "https://4.itdog.cn" -TimeoutSec 5 -UseBasicParsing).Content.Trim()
            Write-Host "IPv4: $ipv4"
          } catch {
            Write-Host "IPv4: 获取失败"
          }

          # 获取 IPv6
          try {
            $ipv6 = (Invoke-WebRequest -Uri "https://6.itdog.cn" -TimeoutSec 5 -UseBasicParsing).Content.Trim()
            Write-Host "IPv6: $ipv6"
          } catch {
            Write-Host "IPv6: 获取失败或不支持"
          }

          # 获取 IP 归属地
          try {
            $geo = Invoke-RestMethod -Uri "https://myip.ipip.net/json" -TimeoutSec 5
            if ($geo.ret -eq "ok") {
              Write-Host "归属地: $($geo.data.location -join ' ')"
            }
          } catch {
            Write-Host "归属地: 获取失败"
          }

      - name: 查看分区信息
        shell: pwsh
        run: |
          Write-Host "=== 分区信息 ==="
          Get-Volume | Where-Object { $_.DriveLetter } |
            Format-Table DriveLetter, FileSystemLabel, FileSystem, @{N='大小GB';E={[math]::Round($_.Size/1GB,2)}}, @{N='可用空间GB';E={[math]::Round($_.SizeRemaining/1GB,2)}} -AutoSize

      - name: 查看磁盘信息
        shell: pwsh
        run: |
          Write-Host "=== 物理磁盘信息 ==="
          Get-PhysicalDisk |
            Format-Table DeviceId, FriendlyName, MediaType, BusType, @{N='大小GB';E={[math]::Round($_.Size/1GB,2)}} -AutoSize
          Write-Host ""
          Write-Host "=== 磁盘分区信息 ==="
          Get-Disk | ForEach-Object {
            $disk = $_
            Write-Host "磁盘 $($disk.Number): $($disk.FriendlyName) ($($disk.PartitionStyle))"
            Get-Partition -DiskNumber $disk.Number | ForEach-Object {
              $vol = Get-Volume -Partition $_ -ErrorAction SilentlyContinue
              if ($vol) {
                Write-Host "  分区 $($_.PartitionNumber): 盘符=$($vol.DriveLetter) 大小=$([math]::Round($_.Size/1GB,2))GB 可用=$([math]::Round($vol.SizeRemaining/1GB,2))GB"
              }
            }
          }

      - name: 查看CPU详细信息
        shell: pwsh
        run: |
          Write-Host "=== CPU 信息 ==="
          $cpu = Get-CimInstance Win32_Processor
          Write-Host "型号: $($cpu.Name)"
          Write-Host "制造商: $($cpu.Manufacturer)"
          Write-Host "核心数: $($cpu.NumberOfCores)"
          Write-Host "逻辑处理器数: $($cpu.NumberOfLogicalProcessors)"
          Write-Host "最大时钟速度: $($cpu.MaxClockSpeed) MHz"
          Write-Host "当前时钟速度: $($cpu.CurrentClockSpeed) MHz"
          Write-Host "L2 缓存: $($cpu.L2CacheSize) KB"
          Write-Host "L3 缓存: $($cpu.L3CacheSize) KB"
          Write-Host "架构: $($cpu.Architecture)"

          Write-Host ""
          Write-Host "=== CPU 缓存详细信息 ==="
          Get-CimInstance Win32_CacheMemory -ErrorAction SilentlyContinue | ForEach-Object {
            $cacheLevel = switch($_.Level) { 2 {"L2"} 3 {"L3"} default {"L$($_.Level)"} }
            $cacheSizeMB = [math]::Round($_.MaxCacheSize/1024,2)
            Write-Host "${cacheLevel}: ${cacheSizeMB} MB ($($_.NumberOfBlocks) blocks)"
          }

      - name: 查看内存和虚拟内存信息
        shell: pwsh
        run: |
          Write-Host "=== 物理内存信息 ==="
          $mem = Get-CimInstance Win32_PhysicalMemory
          $totalGB = [math]::Round(($mem | Measure-Object -Property Capacity -Sum).Sum/1GB, 2)
          Write-Host "总物理内存: $totalGB GB"
          Write-Host "内存条数量: $($mem.Count)"

          # 检测可用物理内存
          $os = Get-CimInstance Win32_OperatingSystem
          $freeGB = [math]::Round($os.FreePhysicalMemory/1MB, 2)
          $usedGB = [math]::Round($totalGB - $freeGB, 2)
          $usagePercent = [math]::Round(($usedGB / $totalGB) * 100, 1)
          Write-Host "可用物理内存: $freeGB GB"
          Write-Host "已用物理内存: $usedGB GB ($usagePercent%)"

          Write-Host ""
          Write-Host "=== 虚拟内存（页面文件）信息 ==="

          # 方法1: Win32_PageFile
          Write-Host "--- 方法1: Win32_PageFile ---"
          $pageFiles = Get-CimInstance Win32_PageFile
          if ($pageFiles) {
            foreach ($pf in $pageFiles) {
              Write-Host "页面文件: $($pf.Name)"
              Write-Host "  所在盘符: $(Split-Path $pf.Name -Qualifier)"
              Write-Host "  当前大小: $([math]::Round($pf.FileSize/1MB, 2)) MB"
              Write-Host "  最大大小: $([math]::Round($pf.MaxSize/1MB, 2)) MB"
            }
          } else {
            Write-Host "Win32_PageFile 未返回数据"
          }

          # 方法2: Win32_PageFileSetting
          Write-Host ""
          Write-Host "--- 方法2: Win32_PageFileSetting ---"
          $pageFileSetting = Get-CimInstance Win32_PageFileSetting -ErrorAction SilentlyContinue
          if ($pageFileSetting) {
            foreach ($pf in $pageFileSetting) {
              Write-Host "页面文件: $($pf.Name)"
              Write-Host "  初始大小: $($pf.InitialSize) MB"
              Write-Host "  最大大小: $($pf.MaximumSize) MB"
            }
          } else {
            Write-Host "Win32_PageFileSetting 未返回数据"
          }

          # 方法3: 检查页面文件是否存在
          Write-Host ""
          Write-Host "--- 方法3: 检查页面文件是否存在 ---"
          $drives = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Root -match '^[A-Z]:\\$' }
          foreach ($drive in $drives) {
            $pageFilePath = "$($drive.Root)pagefile.sys"
            if (Test-Path $pageFilePath) {
              $fileInfo = Get-Item $pageFilePath -Force -ErrorAction SilentlyContinue
              if ($fileInfo) {
                Write-Host "找到页面文件: $pageFilePath"
                Write-Host "  文件大小: $([math]::Round($fileInfo.Length/1MB, 2)) MB"
              }
            }
          }

          # 方法4: 系统自动管理状态
          Write-Host ""
          Write-Host "--- 方法4: 系统配置 ---"
          $memConfig = Get-CimInstance Win32_ComputerSystem
          $autoManage = $memConfig.AutomaticManagedPagefile
          Write-Host "系统自动管理虚拟内存: $autoManage"

          # 方法5: 注册表页面文件配置
          Write-Host ""
          Write-Host "--- 方法5: 注册表页面文件配置 ---"
          $regPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management"
          $regValues = Get-ItemProperty -Path $regPath -ErrorAction SilentlyContinue
          if ($regValues) {
            Write-Host "PagingFiles: $($regValues.PagingFiles)"
            Write-Host "DisablePagingExecutive: $($regValues.DisablePagingExecutive)"
          }

          # 总虚拟内存
          Write-Host ""
          Write-Host "=== 虚拟内存汇总 ==="
          $totalVirtualGB = [math]::Round($os.TotalVirtualMemorySize/1MB, 2)
          $freeVirtualGB = [math]::Round($os.FreeVirtualMemory/1MB, 2)
          $usedVirtualGB = [math]::Round($totalVirtualGB - $freeVirtualGB, 2)
          Write-Host "总虚拟内存: $totalVirtualGB GB"
          Write-Host "可用虚拟内存: $freeVirtualGB GB"
          Write-Host "已用虚拟内存: $usedVirtualGB GB"

          Write-Host ""
          Write-Host "=== 内存条详细信息 ==="
          $mem | ForEach-Object {
            $speed = if ($_.Speed) { "$($_.Speed) MHz" } else { "未知" }
            $type = switch($_.SMBIOSMemoryType) { 20 {"DDR"} 21 {"DDR2"} 24 {"DDR3"} 26 {"DDR4"} 34 {"DDR5"} default {"未知($($_.SMBIOSMemoryType))"} }
            Write-Host "  $($_.DeviceLocator):"
            Write-Host "    容量: $([math]::Round($_.Capacity/1GB,2)) GB"
            Write-Host "    类型: $type"
            Write-Host "    速度: $speed"
            Write-Host "    制造商: $($_.Manufacturer)"
            Write-Host "    序列号: $($_.SerialNumber)"
            Write-Host "    位置: $($_.BankLabel)"
          }

      - name: 安装 speedtest
        if: ${{ inputs.run_speedtest == true }}
        shell: pwsh
        run: |
          Write-Host "=== 安装 speedtest ==="
          npm install -g speedtest-net

      - name: 测试服务器 73226
        if: ${{ inputs.run_speedtest == true }}
        shell: pwsh
        run: |
          Write-Host "=== 网络速度测试（73226） ==="
          speedtest-net --accept-license --accept-gdpr --server-id 73226

      - name: 测试服务器 29716
        if: ${{ inputs.run_speedtest == true }}
        shell: pwsh
        run: |
          Write-Host "=== 网络速度测试（29716） ==="
          speedtest-net --accept-license --accept-gdpr --server-id 29716

      - name: 测试新加坡服务器 26654
        if: ${{ inputs.run_speedtest == true }}
        shell: pwsh
        run: |
          Write-Host "=== 网络速度测试（新加坡 26654 - fdcservers） ==="
          speedtest-net --accept-license --accept-gdpr --server-id 26654
