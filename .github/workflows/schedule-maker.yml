name: 自动批量制作鹅鹅鹅系统

# 定时已启用（2026-10-26 恢复）：每日北京时间 00:00 检测原版更新
on:
  workflow_dispatch:
    inputs:
      force:
        description: "强制构建（忽略原版更新检测）"
        required: false
        default: false
        type: boolean
  schedule:
    # 每日北京时间 02:00（UTC 18:00）检测原版更新。
    # 原 00:00（UTC 16:00）实测被 GitHub 调度延迟到 02:00-04:00 甚至丢班
    # （9 月历史 schedule 触发时间均为 02:18-04:12），故直接错峰到 02:00。
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  check:
    # 轻量任务（curl/jq/git）跑 ubuntu-slim：1 vCPU 容器镜像，启动快占用低
    runs-on: ubuntu-slim
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 检测原版更新
        id: detect
        env:
          FORCE: ${{ inputs.force }}
        run: |
          # jq 缺失则尝试安装；安装失败也绝不中断（后续解析会安全降级为 ERR）
          command -v jq >/dev/null 2>&1 || sudo apt-get install -y jq >/dev/null 2>&1 || echo "  [警告] jq 安装失败，将尝试继续"
          BASE="https://res.yukaidi.top/d/gslb/mupan/System_MSUpdate"
          TARGETS="11/26H1 11/25H2 11/24H2 11/23H2 11/21H2 10/22H2 11/LTSC2024 10/LTSC2021 10/LTSC2019"
          SIG=""
          for t in $TARGETS; do
            tmpf=$(mktemp); codef=$(mktemp)
            # -L 跟随重定向；--max-time 30 防卡死；-w 写出 HTTP 状态码到 codef（含 3xx/4xx/5xx）
            if ! curl -fsSL --max-time 30 -o "$tmpf" -w "%{http_code}" "$BASE/$t/latest_x64.json" > "$codef" 2>/dev/null; then
              http=$(cat "$codef" 2>/dev/null)
              echo "  [跳过] $t 请求失败 (http=${http:-空})"
              v="ERR"
            else
              http=$(cat "$codef")
              if [ "$http" != "200" ]; then
                echo "  [跳过] $t HTTP $http"
                v="ERR"
              else
                # 200 但返回体可能不是合法 JSON（裸数字/HTML），解析失败则记 ERR
                v=$(jq -r '.updver // .date // "ERR"' "$tmpf" 2>/dev/null) || true
                [ -z "$v" ] && v="ERR"
              fi
            fi
            rm -f "$tmpf" "$codef"
            SIG="${SIG}${t}=${v};"
          done
          echo "当前签名: $SIG"

          STATE=".github/nightly-state.txt"
          OLD=""
          if [ -f "$STATE" ]; then OLD=$(cat "$STATE"); fi
          echo "历史签名: $OLD"

          SHOULD="false"
          if [ "$FORCE" = "true" ] || [ "$SIG" != "$OLD" ]; then
            SHOULD="true"
            echo "$SIG" > "$STATE"
            git config user.email "github-actions[bot]@users.noreply.github.com" || true
            git config user.name "github-actions[bot]" || true
            git add "$STATE"
            if ! git diff --cached --quiet; then
              git commit -m "nightly: 原版更新，签到状态 $(date +%F)" || echo "  [警告] 提交失败"
              # 推送失败（并发运行抢占 / 分支保护 / 网络抖动）不影响本次构建判定
              git push origin "HEAD:${GITHUB_REF_NAME:-main}" || echo "  [警告] 状态文件推送失败（可能被并发运行抢占），不影响本次构建判定"
            fi
          fi
          echo "should_build=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "应构建: $SHOULD"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - w1126h164
          - w1125h264
          - w1124h264
          - w1123h264
          - w1121h264
          - w1022h264
          - w11lt2464
          - w10lt2164
          - w10lt1964
        fulldrv:
          - false
          - true
    name: ${{ matrix.target }}${{ matrix.fulldrv == true && '-完整驱动' || '' }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 获取 rclone 配置
        uses: actions/checkout@v6
        with:
          repository: yukaidi1220/rclone-action
          token: ${{ secrets.RCLONE_TOKEN }}
          path: bin

      - name: 下载 rclone
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/yukaidi1220/rclone/releases/latest/download/rclone-cdn-windows-amd64.exe" -OutFile "bin/rclone.exe"

      - name: 执行构建任务
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/gerardog/gsudo/releases/download/v2.6.1/gsudo.portable.zip" -OutFile "gsudo.zip"
          Expand-Archive -Path "gsudo.zip" -DestinationPath "gsudo"
          $env:Path = "$PWD\gsudo\x64;$env:Path"
          Import-Module "$PWD\gsudo\x64\gsudoModule.psm1"

          gsudo --ti .\makexrsys.ps1 -Target "${{ matrix.target }}"${{ matrix.fulldrv == true && ' -FullDrv' || '' }} -Latest

  # 构建完成后自动跑开机测试（验证镜像真能开机 + 产出测试视频供 EEEOS-GET 展示）。
  # 扫描全部 latest 指针，挑出「构建日期 = 今天（北京时间）」的所有版本，逐个触发测试——
  # 即当日构建出的每一个镜像都会被开机验证，每个版本各自产出测试视频。
  boot-test:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    # 纯触发器（gh workflow run），跑 ubuntu-slim：pwsh/gh 预装，无 Windows 依赖
    runs-on: ubuntu-slim
    timeout-minutes: 60
    permissions:
      actions: write   # gh workflow run 触发 image-boot-test 必需
      contents: read
    env:
      TZ: Asia/Shanghai   # Linux 无 tzutil，用 TZ 环境变量取北京时间
    steps:
      - name: 扫描当日构建并逐个触发开机测试
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $today = (Get-Date).ToString('yyyy.MM.dd')
          "今日（北京）: $today"
          $base = "https://res.yukaidi.top/d/cr/qzy-hk/System/Nightly"
          # 全部 latest 指针（8 版本 × 精简/完整驱动 = 16 个）
          $pointers = @(
            'EEEOS_Win11_26H1_Pro_x64_CN_Full_Net',   'EEEOS_Win11_26H1_Pro_x64_CN_Full_DrvCeo',
            'EEEOS_Win11_25H2_Pro_x64_CN_Full_Net',   'EEEOS_Win11_25H2_Pro_x64_CN_Full_DrvCeo',
            'EEEOS_Win11_24H2_Pro_x64_CN_Full_Net',   'EEEOS_Win11_24H2_Pro_x64_CN_Full_DrvCeo',
            'EEEOS_Win11_23H2_Pro_x64_CN_Full_Net',   'EEEOS_Win11_23H2_Pro_x64_CN_Full_DrvCeo',
            'EEEOS_Win11_LTSC2024_EntS_x64_CN_Full_Net', 'EEEOS_Win11_LTSC2024_EntS_x64_CN_Full_DrvCeo',
            'EEEOS_Win10_22H2_Pro_x64_CN_Full_Net',   'EEEOS_Win10_22H2_Pro_x64_CN_Full_DrvCeo',
            'EEEOS_Win10_LTSC2021_EntS_x64_CN_Full_Net', 'EEEOS_Win10_LTSC2021_EntS_x64_CN_Full_DrvCeo',
            'EEEOS_Win10_LTSC2019_EntS_x64_CN_Full_Net', 'EEEOS_Win10_LTSC2019_EntS_x64_CN_Full_DrvCeo'
          )
          $fired = 0; $skipped = 0; $failed = @()
          foreach ($p in $pointers) {
            try {
              $obj = Invoke-RestMethod -Uri "$base/$p.json" -TimeoutSec 30
              $date = "$($obj.sys.date)"
              if ($date -ne $today) { "  [跳过] $p（构建日期 $date ≠ 今日）"; $skipped++; continue }
              $url = $obj.sys.url
              if (-not $url) { "  [跳过] $p（指针无 url）"; $skipped++; continue }
              "  [触发] $p  ← $date"
              gh workflow run image-boot-test.yml -R ${{ github.repository }} --ref main `
                -f use_latest=false -f esd_url=$url -f boot_rounds=8 -f run_minutes=100
              if ($LASTEXITCODE -ne 0) { "::warning::$p 触发失败（exit $LASTEXITCODE）"; $failed += $p }
              else { $fired++; Start-Sleep -Seconds 3 }   # 错开，避免瞬时并发打满配额
            } catch { "  [跳过] $p（指针读取失败：$($_.Exception.Message)）"; $skipped++ }
          }
          "── 汇总：触发 $fired 个，跳过 $skipped 个，失败 $($failed.Count) 个 ──"
          if ($fired -eq 0 -and $skipped -eq 0) { Write-Error "所有指针都读取失败，触发器异常" }
          if ($fired -eq 0 -and $skipped -gt 0) { "::warning::今日没有构建出任何镜像（指针日期均非今日），未触发开机测试" }
          # 有失败就必须红：否则 token 权限不足时 16 个全 403 也显示"正常结束"
          if ($failed.Count -gt 0) { Write-Error "以下 $($failed.Count) 个版本触发失败（多为 token 缺 actions:write），可手动补跑：$($failed -join ', ')" }

# 2026-10-27: 触碰文件强制 GitHub 重新索引 schedule（元数据 updated 停在 09-23）
