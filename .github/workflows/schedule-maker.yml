name: 自动批量制作鹅鹅鹅系统
on:
  workflow_dispatch:
  # schedule:
  #   # - cron: '0 0 * * *' # 每日构建
  #   - cron: "0 0 * * 5" # 每周构建

jobs:
  makexrsys:
    runs-on: windows-latest
    name: ${{ matrix.target }}${{ matrix.fulldrv == true && '-完整驱动' || '' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - w1126h164
          - w1125h264
          - w1124h264
          - w1123h264
          - w1121h264
          - w1022h264
          - w11lt2464
          - w10lt2164
          - w10lt1964
          - w7ult64
        fulldrv:
          - true
          - false
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 获取 rclone 配置
        uses: actions/checkout@v6
        with:
          repository: yukaidi1220/rclone-action
          token: ${{ secrets.RCLONE_TOKEN }}
          path: bin

      - name: 执行构建任务
        shell: pwsh
        run: |
          # 安装 gsudo
          Invoke-WebRequest -Uri "https://github.com/gerardog/gsudo/releases/download/v2.6.1/gsudo.portable.zip" -OutFile "gsudo.zip"
          Expand-Archive -Path "gsudo.zip" -DestinationPath "gsudo"
          $env:Path = "$PWD\gsudo\x64;$env:Path"
          Import-Module "$PWD\gsudo\x64\gsudoModule.psm1"

          gsudo --ti .\makexrsys.ps1 -Target "${{ matrix.target }}" -Latest ${{ matrix.fulldrv == true && '-FullDrv' || '' }}
