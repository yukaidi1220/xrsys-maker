name: DISM 批量化验证

on:
  workflow_dispatch:
    inputs:
      target:
        description: "目标系统版本"
        required: true
        type: choice
        options:
          - w1126h164
          - w1125h264
          - w1123h264
          - w1022h264
          - w11lt2464
          - w10lt2164

jobs:
  test-dism-batch:
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 下载工具
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "bin" -Force
          Invoke-WebRequest -Uri 'https://github.com/yukaidi1220/xrsys-maker/releases/download/Tool_Resource/wimlib-1.14.4-windows-x86_64-bin.zip' -OutFile "bin\wimlib.zip"
          Expand-Archive -Path "bin\wimlib.zip" -DestinationPath "bin\wimlib" -Force
          Copy-Item "bin\wimlib\wimlib-imagex.exe" "bin\wimlib-imagex.exe"
          Copy-Item "bin\wimlib\libwim-15.dll" "bin\libwim-15.dll"
          Invoke-WebRequest -Uri 'https://github.com/yukaidi1220/xrsys-maker/releases/download/Tool_Resource/aria2-1.37.0-win-64bit-build1.zip' -OutFile "bin\aria2.zip"
          Expand-Archive -Path "bin\aria2.zip" -DestinationPath "bin\aria2" -Force
          Copy-Item "bin\aria2\aria2-1.37.0-win-64bit-build1\aria2c.exe" "bin\aria2c.exe"

      - name: 下载测试镜像
        shell: pwsh
        run: |
          $target = "${{ inputs.target }}"
          $MSUpdate_URL = "https://list.xrgzs.top/d/pxy/System/MSUpdate"

          switch ($target) {
            "w1126h164" {
              $obj = Invoke-RestMethod -Uri "$MSUpdate_URL/11/26H1/latest_x64.json"
              $osUrl = "$MSUpdate_URL/11/26H1/" + $obj.os_version + '/' + $obj.name
              $osFile = $obj.name
              $osIndex = 4
            }
            "w1125h264" {
              $obj = Invoke-RestMethod -Uri "$MSUpdate_URL/11/25H2/latest_x64.json"
              $osUrl = "$MSUpdate_URL/11/25H2/" + $obj.os_version + '/' + $obj.name
              $osFile = $obj.name
              $osIndex = 4
            }
            "w1123h264" {
              $obj = Invoke-RestMethod -Uri "$MSUpdate_URL/11/23H2/latest_x64.json"
              $osUrl = "$MSUpdate_URL/11/23H2/" + $obj.os_version + '/' + $obj.name
              $osFile = $obj.name
              $osIndex = 4
            }
            "w1022h264" {
              $obj = Invoke-RestMethod -Uri "$MSUpdate_URL/10/22H2/latest_x64.json"
              $osUrl = "$MSUpdate_URL/10/22H2/" + $obj.os_version + '/' + $obj.name
              $osFile = $obj.name
              $osIndex = 4
            }
            "w11lt2464" {
              $obj = Invoke-RestMethod -Uri "$MSUpdate_URL/11/LTSC2024/latest_x64.json"
              $osUrl = "$MSUpdate_URL/11/LTSC2024/" + $obj.os_version + '/' + $obj.name
              $osFile = $obj.name
              $osIndex = 1
            }
            "w10lt2164" {
              $obj = Invoke-RestMethod -Uri "$MSUpdate_URL/10/LTSC2021/latest_x64.json"
              $osUrl = "$MSUpdate_URL/10/LTSC2021/" + $obj.os_version + '/' + $obj.name
              $osFile = $obj.name
              $osIndex = 1
            }
          }

          Write-Host "下载镜像: $osUrl"
          & .\bin\aria2c.exe --no-conf=true --continue --allow-overwrite=true --summary-interval=0 --remote-time=true --retry-wait=5 --check-certificate=false -s16 -x16 "$osUrl" --out="$osFile"

          # 如果是 ISO，解压出 install.wim 或 install.esd
          $ext = [System.IO.Path]::GetExtension("$osFile")
          if ($ext -eq ".iso") {
            & "C:\Program Files\7-Zip\7z.exe" e -y "$osFile" sources\install.wim
            if (Test-Path "install.wim") {
              $osFile = "install.wim"
            } else {
              & "C:\Program Files\7-Zip\7z.exe" e -y "$osFile" sources\install.esd
              if (Test-Path "install.esd") {
                $osFile = "install.esd"
              } else {
                Write-Error "解压 install.wim 和 install.esd 均失败"
                exit 1
              }
            }
          }

          # 检查文件是否存在
          if (-not (Test-Path "$osFile")) {
            Write-Error "镜像文件不存在: $osFile"
            exit 1
          }
          Write-Host "镜像文件: $(Resolve-Path "$osFile")"
          Write-Host "镜像大小: $([Math]::Round((Get-Item "$osFile").Length / 1GB, 2)) GB"

          "OS_FILE=$osFile" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OS_INDEX=$osIndex" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 释放镜像到目录
        shell: pwsh
        run: |
          $mountDir = "$(Get-Location)\mount"
          New-Item -ItemType Directory -Path $mountDir -Force
          Write-Host "释放镜像到 $mountDir..."
          Write-Host "镜像文件: $env:OS_FILE"
          Write-Host "镜像索引: $env:OS_INDEX"

          & .\bin\wimlib-imagex.exe apply "$env:OS_FILE" "$env:OS_INDEX" "$mountDir"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "wimlib apply 失败，退出码: $LASTEXITCODE"
            exit 1
          }
          Write-Host "镜像释放成功"
          "MOUNT_DIR=$mountDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ============================================================
      # 第一轮结论（已确认）:
      #   /Remove-ProvisionedAppxPackage 不支持多参数 (Error 87)
      #   /Remove-Capability 支持多参数
      #   /Disable-Feature 支持多参数
      # 第二轮深入测试: 失败行为 + 不同父包 + 性能量化
      # ============================================================

      - name: 测试 A - /Remove-Capability 批量中途失败行为
        continue-on-error: true
        shell: pwsh
        run: |
          $mountDir = "$env:MOUNT_DIR"
          Write-Host "========================================"
          Write-Host "测试 A: /Remove-Capability 批量中途失败行为"
          Write-Host "========================================"

          $capabilities = Get-WindowsCapability -Path "$mountDir"
          $installedCaps = $capabilities | Where-Object { $_.State -eq 'Installed' }
          Write-Host "已安装 Capability 数量: $($installedCaps.Count)"

          if ($installedCaps.Count -ge 1) {
            $realCap = $installedCaps[0].Name
            $fakeCap = "Fake.Capability.NotExist~~~~0.0.1.0"

            Write-Host "真实 Capability: $realCap"
            Write-Host "虚假 Capability: $fakeCap"
            Write-Host ""

            # 先记录删除前状态
            $beforeCount = (Get-WindowsCapability -Path "$mountDir" | Where-Object { $_.State -eq 'Installed' }).Count
            Write-Host "删除前已安装 Capability 数量: $beforeCount"

            Write-Host "执行: DISM /Image:`"$mountDir`" /Remove-Capability /CapabilityName:`"$realCap`" /CapabilityName:`"$fakeCap`""
            $output = DISM.exe /Image:"$mountDir" /Remove-Capability /CapabilityName:"$realCap" /CapabilityName:"$fakeCap" 2>&1
            $exitCode = $LASTEXITCODE
            $output | Tee-Object -FilePath "testA_output.log"
            Write-Host "退出码: $exitCode"

            # 检查真实 Capability 是否还在
            $realCapState = (Get-WindowsCapability -Path "$mountDir" | Where-Object { $_.Name -eq $realCap }).State
            Write-Host "真实 Capability 状态: $realCapState"

            $afterCount = (Get-WindowsCapability -Path "$mountDir" | Where-Object { $_.State -eq 'Installed' }).Count
            Write-Host "删除后已安装 Capability 数量: $afterCount"

            if ($realCapState -eq 'Installed') {
              Write-Host "结论: 真实 Capability 仍在 -> 整个操作回滚"
            } else {
              Write-Host "结论: 真实 Capability 已删除 -> 部分提交，虚假 Capability 被跳过"
            }

            # 检查镜像是否可继续操作
            $verifyOutput = DISM.exe /Image:"$mountDir" /Get-Capabilities 2>&1
            $verifyExit = $LASTEXITCODE
            Write-Host "验证命令退出码: $verifyExit"
            if ($verifyExit -eq 0) {
              Write-Host "结论: 镜像仍可继续操作"
            } else {
              Write-Host "结论: 镜像可能处于不一致状态"
            }
          } else {
            Write-Host "已安装 Capability 数量不足，跳过测试"
          }

      - name: 测试 B - /Disable-Feature 批量中途失败行为
        continue-on-error: true
        shell: pwsh
        run: |
          $mountDir = "$env:MOUNT_DIR"
          Write-Host "========================================"
          Write-Host "测试 B: /Disable-Feature 批量中途失败行为"
          Write-Host "========================================"

          $features = Get-WindowsOptionalFeature -Path "$mountDir" | Where-Object { $_.State -eq 'Enabled' }
          Write-Host "已启用功能数量: $($features.Count)"

          if ($features.Count -ge 1) {
            $realFeat = $features[0].FeatureName
            $fakeFeat = "FakeFeatureNotExist"

            Write-Host "真实 Feature: $realFeat"
            Write-Host "虚假 Feature: $fakeFeat"
            Write-Host ""

            Write-Host "执行: DISM /Image:`"$mountDir`" /Disable-Feature /FeatureName:`"$realFeat`" /FeatureName:`"$fakeFeat`""
            $output = DISM.exe /Image:"$mountDir" /Disable-Feature /FeatureName:"$realFeat" /FeatureName:"$fakeFeat" 2>&1
            $exitCode = $LASTEXITCODE
            $output | Tee-Object -FilePath "testB_output.log"
            Write-Host "退出码: $exitCode"

            # 检查真实 Feature 状态
            $realFeatState = (Get-WindowsOptionalFeature -Path "$mountDir" -FeatureName $realFeat).State
            Write-Host "真实 Feature 状态: $realFeatState"

            if ($realFeatState -eq 'Enabled') {
              Write-Host "结论: 真实 Feature 仍在 -> 整个操作回滚"
            } else {
              Write-Host "结论: 真实 Feature 已禁用 -> 部分提交，虚假 Feature 被跳过"
            }

            # 检查镜像是否可继续操作
            $verifyOutput = DISM.exe /Image:"$mountDir" /Get-Features 2>&1
            $verifyExit = $LASTEXITCODE
            Write-Host "验证命令退出码: $verifyExit"
            if ($verifyExit -eq 0) {
              Write-Host "结论: 镜像仍可继续操作"
            } else {
              Write-Host "结论: 镜像可能处于不一致状态"
            }
          } else {
            Write-Host "已启用功能数量不足，跳过测试"
          }

      - name: 测试 C - /Disable-Feature 不同父包批量
        continue-on-error: true
        shell: pwsh
        run: |
          $mountDir = "$env:MOUNT_DIR"
          Write-Host "========================================"
          Write-Host "测试 C: /Disable-Feature 不同父包批量"
          Write-Host "========================================"

          # 找到 Windows-Defender 和其他不同父包的 Feature
          $features = Get-WindowsOptionalFeature -Path "$mountDir" | Where-Object { $_.State -eq 'Enabled' }

          # 列出所有已启用 Feature 及其父包信息
          Write-Host "已启用 Feature 列表（前 10 个）:"
          $features | Select-Object -First 10 | ForEach-Object {
            Write-Host "  $($_.FeatureName)"
          }

          # 尝试找 Windows-Defender 相关 Feature
          $defenderFeat = $features | Where-Object { $_.FeatureName -like "*Windows-Defender*" } | Select-Object -First 1
          # 找一个非 Defender 的 Feature
          $otherFeat = $features | Where-Object { $_.FeatureName -notlike "*Windows-Defender*" } | Select-Object -First 1

          if ($defenderFeat -and $otherFeat) {
            Write-Host ""
            Write-Host "Defender Feature: $($defenderFeat.FeatureName)"
            Write-Host "其他 Feature: $($otherFeat.FeatureName)"

            Write-Host ""
            Write-Host "执行: DISM /Image:`"$mountDir`" /Disable-Feature /FeatureName:`"$($defenderFeat.FeatureName)`" /FeatureName:`"$($otherFeat.FeatureName)`""
            $output = DISM.exe /Image:"$mountDir" /Disable-Feature /FeatureName:"$($defenderFeat.FeatureName)" /FeatureName:"$($otherFeat.FeatureName)" 2>&1
            $exitCode = $LASTEXITCODE
            $output | Tee-Object -FilePath "testC_output.log"
            Write-Host "退出码: $exitCode"

            $defState = (Get-WindowsOptionalFeature -Path "$mountDir" -FeatureName $defenderFeat.FeatureName).State
            $otherState = (Get-WindowsOptionalFeature -Path "$mountDir" -FeatureName $otherFeat.FeatureName).State
            Write-Host "Defender Feature 状态: $defState"
            Write-Host "其他 Feature 状态: $otherState"

            if ($defState -ne 'Enabled' -and $otherState -ne 'Enabled') {
              Write-Host "结论: 不同父包 Feature 可以批量禁用"
            } else {
              Write-Host "结论: 不同父包 Feature 批量禁用可能失败"
            }
          } else {
            Write-Host "未找到合适的 Feature 组合，跳过测试"
          }

      - name: 测试 D - Appx 逐个删除性能基准
        continue-on-error: true
        shell: pwsh
        run: |
          $mountDir = "$env:MOUNT_DIR"
          Write-Host "========================================"
          Write-Host "测试 D: Appx 逐个删除性能基准"
          Write-Host "========================================"

          $appxPackages = Get-AppxProvisionedPackage -Path "$mountDir"
          Write-Host "当前已预装 Appx 包数量: $($appxPackages.Count)"

          # 只测试前 5 个包，量化每次调用的开销
          $testPkgs = $appxPackages | Select-Object -First 5
          $times = @()

          foreach ($pkg in $testPkgs) {
            $pkgName = $pkg.PackageName
            Write-Host ""
            Write-Host "删除: $pkgName"
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $output = DISM.exe /Image:"$mountDir" /Remove-ProvisionedAppxPackage /PackageName:"$pkgName" 2>&1
            $sw.Stop()
            $exitCode = $LASTEXITCODE
            $elapsed = $sw.Elapsed.TotalSeconds
            $times += $elapsed

            Write-Host "  退出码: $exitCode, 耗时: $([Math]::Round($elapsed, 2))s"
            if ($exitCode -ne 0) {
              $output | Select-Object -Last 3 | ForEach-Object { Write-Host "  $_" }
            }
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "性能汇总:"
          Write-Host "  删除数量: $($times.Count)"
          if ($times.Count -gt 0) {
            Write-Host "  总耗时: $([Math]::Round(($times | Measure-Object -Sum).Sum, 2))s"
            Write-Host "  平均每次: $([Math]::Round(($times | Measure-Object -Average).Average, 2))s"
            Write-Host "  最快: $([Math]::Round(($times | Measure-Object -Minimum).Minimum, 2))s"
            Write-Host "  最慢: $([Math]::Round(($times | Measure-Object -Maximum).Maximum, 2))s"
          }

          # 估算 30 个包的总耗时
          if ($times.Count -ge 3) {
            $avgTime = ($times | Measure-Object -Average).Average
            $estimated30 = $avgTime * 30
            Write-Host "  估算 30 个包总耗时: $([Math]::Round($estimated30, 2))s ($([Math]::Round($estimated30 / 60, 1))min)"
          }

          # 保存结果
          "Appx 逐个删除性能基准:" | Out-File -FilePath "testD_output.log"
          "  删除数量: $($times.Count)" | Out-File -FilePath "testD_output.log" -Append
          if ($times.Count -gt 0) {
            "  总耗时: $([Math]::Round(($times | Measure-Object -Sum).Sum, 2))s" | Out-File -FilePath "testD_output.log" -Append
            "  平均每次: $([Math]::Round(($times | Measure-Object -Average).Average, 2))s" | Out-File -FilePath "testD_output.log" -Append
          }

      - name: 测试 E - PowerShell cmdlet vs DISM.exe 逐个删除对比
        continue-on-error: true
        shell: pwsh
        run: |
          $mountDir = "$env:MOUNT_DIR"
          Write-Host "========================================"
          Write-Host "测试 E: PowerShell cmdlet vs DISM.exe 逐个删除对比"
          Write-Host "========================================"

          $appxPackages = Get-AppxProvisionedPackage -Path "$mountDir"
          Write-Host "当前已预装 Appx 包数量: $($appxPackages.Count)"

          if ($appxPackages.Count -ge 4) {
            # 前两个用 DISM.exe 删除
            $dismPkgs = $appxPackages | Select-Object -First 2
            # 后两个用 PowerShell cmdlet 删除
            $psPkgs = $appxPackages | Select-Object -Skip 2 -First 2

            Write-Host ""
            Write-Host "--- DISM.exe 方式 ---"
            $dismTimes = @()
            foreach ($pkg in $dismPkgs) {
              $pkgName = $pkg.PackageName
              Write-Host "删除: $pkgName"
              $sw = [System.Diagnostics.Stopwatch]::StartNew()
              $output = DISM.exe /Image:"$mountDir" /Remove-ProvisionedAppxPackage /PackageName:"$pkgName" 2>&1
              $sw.Stop()
              $exitCode = $LASTEXITCODE
              $elapsed = $sw.Elapsed.TotalSeconds
              $dismTimes += $elapsed
              Write-Host "  退出码: $exitCode, 耗时: $([Math]::Round($elapsed, 2))s"
            }

            Write-Host ""
            Write-Host "--- PowerShell cmdlet 方式 ---"
            $psTimes = @()
            foreach ($pkg in $psPkgs) {
              $pkgName = $pkg.PackageName
              Write-Host "删除: $pkgName"
              $sw = [System.Diagnostics.Stopwatch]::StartNew()
              Remove-AppxProvisionedPackage -Path "$mountDir" -PackageName "$pkgName" 2>&1 | Out-Null
              $sw.Stop()
              $elapsed = $sw.Elapsed.TotalSeconds
              $psTimes += $elapsed
              Write-Host "  耗时: $([Math]::Round($elapsed, 2))s"
            }

            Write-Host ""
            Write-Host "========================================"
            Write-Host "对比汇总:"
            if ($dismTimes.Count -gt 0) {
              Write-Host "  DISM.exe 平均: $([Math]::Round(($dismTimes | Measure-Object -Average).Average, 2))s"
            }
            if ($psTimes.Count -gt 0) {
              Write-Host "  PS cmdlet 平均: $([Math]::Round(($psTimes | Measure-Object -Average).Average, 2))s"
            }
          } else {
            Write-Host "Appx 包数量不足 4 个，跳过对比测试"
          }

      - name: 汇总测试结果
        if: always()
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "测试结果汇总"
          Write-Host "========================================"

          $testFiles = @("testA_output.log", "testB_output.log", "testC_output.log", "testD_output.log", "testE_output.log")
          foreach ($file in $testFiles) {
            if (Test-Path $file) {
              Write-Host ""
              Write-Host "--- $file ---"
              Get-Content $file | ForEach-Object { Write-Host $_ }
            }
          }

      - name: 清理
        if: always()
        shell: pwsh
        run: |
          Write-Host "清理测试环境..."
          $mountDir = "$env:MOUNT_DIR"
          if ($mountDir -and (Test-Path "$mountDir")) {
            Remove-Item -Path "$mountDir" -Recurse -Force -ErrorAction SilentlyContinue
          }
          $osFile = "$env:OS_FILE"
          if ($osFile -and (Test-Path "$osFile")) {
            Remove-Item -Path "$osFile" -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -Path "install.wim", "install.esd", "*.iso", "*.zip" -ErrorAction SilentlyContinue
          Remove-Item -Path "bin", "mount" -Recurse -Force -ErrorAction SilentlyContinue
