# EEEOS 镜像自动开机测试：建盘 → 释放 → 引导 → QEMU 开机 → 每 3 秒截图 → 打包 artifact。
# 能力依据 runner-probe.yml 实测（2026-10-25）：windows-latest HypervisorPresent=True、
# WHPX 加速可用（失败自动回退 TCG）、choco 可装 QEMU 11.x、自带 edk2 UEFI 固件、VHDX 原生支持。
# 注意被测镜像须具备无人值守能力（EEEOS nightly 自带 injectdeploy + unattend）。
name: 镜像开机测试

on:
  workflow_dispatch:
    inputs:
      use_latest:
        description: "取当日最新指针（nightly 构建产物，按北京时间找当天目录）"
        required: false
        default: "true"
      esd_url:
        description: "ESD 直链（use_latest=false 时必填；res.yukaidi.top 的 302 链接即可）"
        required: false
        default: ""
      esd_ver:
        description: "最新指针名（如 EEEOS_Win11_26H1_Pro_x64_CN_Full_Net；use_latest=true 时用）"
        required: false
        default: "EEEOS_Win11_26H1_Pro_x64_CN_Full_Net"
      image_index:
        description: "镜像索引（1 起；nightly ESD 单映像自动回退 1，原版 ISO 的多版本母盘 4=专业版）"
        required: false
        default: "4"
      mem_gb:
        description: "虚拟机内存 GB"
        required: false
        default: "6"
      run_minutes:
        description: "开机测试最长时长（分钟）——部署链实测 4 次开机总耗时 >60min"
        required: false
        default: "100"
      accel:
        description: "QEMU 加速器（whpx=验证可用；tcg 极慢无法出固件；irqchip=off 会早期挂死）"
        required: false
        default: "whpx"
      cpu_model:
        description: "CPU 型号（Skylake-Client=验证可用；qemu64 两分半必崩 VP exit 4）"
        required: false
        default: "Skylake-Client"
      smp:
        description: "vCPU 数（WHPX 多核竞态可试 2/1）"
        required: false
        default: "4"
      runner:
        description: "runner 镜像标签（windows-latest / windows-2025）"
        required: false
        default: "windows-latest"
      boot_rounds:
        description: "最多开机次数（部署流程会连续重启多次直至正常关机，默认 8）"
        required: false
        default: "8"
      attempts:
        description: "并行尝试次数（1=单份，默认；宿主机抽风已用 QMP 重试+按轮重拉兜底）"
        required: false
        default: "1"
      machine:
        description: "机器型号（q35=现代PCIe+AHCI；pc=i440fx 老式IDE，模拟最成熟）"
        required: false
        default: "q35"
      disk:
        description: "QEMU 磁盘格式（qcow2=默认，QEMU 原生格式，VHDX 有动态扩容损坏 bug QEMU#727 已拉黑）"
        required: false
        default: "qcow2"
      nic:
        description: "网卡型号（e1000=现状；none=去掉网卡排除变量，部署离线不需要）"
        required: false
        default: "e1000"
      bcdboot:
        description: "写引导用的 bcdboot（host=宿主机版本；image=镜像自带，实测在宿主 exit -1058471934 不可用）"
        required: false
        default: "host"
      esp_native:
        description: "ESP 原生化：bcdboot 后用镜像 EX 版引导文件覆盖 ESP（消除宿主版缝合，true/false）"
        required: false
        default: "false"
  schedule:
    # 每天抽查当日最新 nightly 构建（北京时间 04:30 = UTC 20:30，即构建 cron 00:00 后 4.5h）
    - cron: "30 20 * * *"

jobs:
  boot-test:
    runs-on: windows-latest
    timeout-minutes: 300
    # 关键：schedule 触发时 inputs.* 全为空（默认值只对 workflow_dispatch 生效），
    # 会生成 `-machine ` 空参数、AddMinutes() 空参抛错——nightly 从来没跑通的真因。
    # 统一在 job 级 env 兜底，脚本里改用 $env:*，两种触发方式行为一致。
    env:
      IN_USE_LATEST: ${{ inputs.use_latest || 'true' }}
      IN_ESD_URL: $env:IN_ESD_URL
      IN_ESD_VER: ${{ inputs.esd_ver || 'EEEOS_Win11_26H1_Pro_x64_CN_Full_Net' }}
      IN_IMAGE_INDEX: ${{ inputs.image_index || '4' }}
      IN_MEM_GB: ${{ inputs.mem_gb || '6' }}
      IN_RUN_MINUTES: ${{ inputs.run_minutes || '100' }}
      IN_ACCEL: ${{ inputs.accel || 'whpx' }}
      IN_CPU_MODEL: ${{ inputs.cpu_model || 'Skylake-Client' }}
      IN_SMP: $env:IN_SMP
      IN_MACHINE: ${{ inputs.machine || 'q35' }}
      IN_DISK: ${{ inputs.disk || 'qcow2' }}
      IN_NIC: ${{ inputs.nic || 'e1000' }}
      IN_BOOT_ROUNDS: ${{ inputs.boot_rounds || '8' }}
      IN_ATTEMPTS: ${{ inputs.attempts || '1' }}
      IN_BCD_BOOT: ${{ inputs.bcdboot || 'host' }}
      IN_ESP_NATIVE: ${{ inputs.esp_native || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        # 双 attempt（默认已撤为 1）：矩阵里按 IN_ATTEMPTS 展开
        attempt: ${{ (inputs.attempts || '1') == '1' && fromJSON('["1"]') || fromJSON('["1","2"]') }}
    continue-on-error: ${{ matrix.attempt != (inputs.attempts || '1') }}
    steps:

      - name: 安装 QEMU 与 wimlib
        shell: pwsh
        run: |
          choco install qemu -y --no-progress
          $qemu = Get-ChildItem "C:\Program Files\qemu" -Filter qemu-system-x86_64.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $qemu) { $qemu = Get-ChildItem "C:\ProgramData\chocolatey\lib" -Filter qemu-system-x86_64.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName }
          if (-not $qemu) { Write-Error "找不到 qemu-system-x86_64.exe" }
          "QEMU: $qemu"
          Add-Content $env:GITHUB_PATH (Split-Path $qemu)
          & $qemu --version
          Invoke-WebRequest -Uri "https://github.com/yukaidi1220/xrsys-maker/releases/download/Tool_Resource/wimlib-1.14.4-windows-x86_64-bin.zip" -OutFile wimlib.zip
          Expand-Archive wimlib.zip -DestinationPath bin\wimlib -Force
          # 该 zip 无顶层目录，直接平铺拷出两个需要的文件
          Copy-Item bin\wimlib\wimlib-imagex.exe bin\ -Force
          Copy-Item bin\wimlib\libwim-15.dll bin\ -Force
          .\bin\wimlib-imagex.exe --version

      - name: 解析被测 ESD（当日最新指针）
        id: resolve
        shell: pwsh
        run: |
          # 全流程统一北京时间：runner 默认 UTC，先设时区
          tzutil /s "China Standard Time" 2>$null
          $cstNow = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date).ToUniversalTime(), 'China Standard Time')
          "北京时间: $($cstNow.ToString('yyyy-MM-dd HH:mm:ss'))"
          $useLatest = $env:IN_USE_LATEST
          $url = "$env:IN_ESD_URL"
          if ($useLatest -eq "true") {
            $ver = "$env:IN_ESD_VER"
            $base = "https://res.yukaidi.top/d/cr/qzy-hk/System/Nightly"
            # 指针文件（nightly 构建的 latest）→ 里面的 sys.url 就是当日 ESD 直链
            $ptr = "$base/$ver.json"
            try {
              $obj = Invoke-RestMethod -Uri $ptr -TimeoutSec 60
              $url = $obj.sys.url
              $date = $obj.sys.date
              "最新指针: $ptr"
              "  版本: $($obj.sys.ver)  构建日期(北京): $date  大小: $($obj.sys.size)"
              "  ESD: $url"
              # 时效检查：指针日期距今超过 48h → 说明 nightly 构建没跑（或没更新指针），明确告警
              $built = [datetime]::ParseExact($date, 'yyyy.MM.dd', $null)
              $ageH = ($cstNow.Date - $built.Date).TotalHours
              if ($ageH -gt 48) { "::warning::最新指针构建日期 $date 距今 $([int]$ageH) 小时——nightly 构建可能未产出新镜像，本次测试的是旧镜像" }
              else { "指针新鲜度: 距今 $([int]$ageH) 小时（正常）" }
            } catch { Write-Error "取最新指针失败（$ptr）：$($_.Exception.Message)" }
          }
          if (-not $url) { Write-Error "未取得 ESD 链接（use_latest=$useLatest 且 esd_url 为空）" }
          $esdFileName = [IO.Path]::GetFileName(([Uri]$url).AbsolutePath)
          "esd_url=$url" >> $env:GITHUB_OUTPUT
          "esd_name=$esdFileName" >> $env:GITHUB_OUTPUT
          "esd_date=$(if ($date) { $date } else { 'unknown' })" >> $env:GITHUB_OUTPUT

      - name: 下载 ESD
        shell: pwsh
        run: |
          # aria2c 16 连接下载；res.yukaidi.top 的 302 目标是签名直链，
          # 先解析出最终 URL 再交给 aria2（参考 makexrsys.ps1）
          if (-not (Test-Path .\bin\aria2c.exe)) {
            Invoke-WebRequest -Uri "https://github.com/yukaidi1220/xrsys-maker/releases/download/Tool_Resource/aria2-1.37.0-win-64bit-build1.zip" -OutFile aria2.zip
            Expand-Archive aria2.zip -DestinationPath temp-aria2 -Force
            Move-Item "temp-aria2\aria2-1.37.0-win-64bit-build1\aria2c.exe" .\bin\ -Force
          }
          $esdUrl = "${{ steps.resolve.outputs.esd_url }}"
          $finalUrl = $esdUrl
          try {
            $req = [System.Net.WebRequest]::Create($esdUrl)
            $req.AllowAutoRedirect = $false
            $res = $req.GetResponse()
            $loc = $res.GetResponseHeader('Location'); $res.Close()
            if ($loc) { $finalUrl = $loc }
          } catch { }
          if (-not $finalUrl) { Write-Error "未取得 ESD 链接" }
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & .\bin\aria2c.exe --no-conf=true --continue --allow-overwrite=true --summary-interval=0 `
            --remote-time=true --retry-wait=5 --check-certificate=false -x16 -s16 "$finalUrl" -o image.esd
          if ($LASTEXITCODE -ne 0) { Write-Error "aria2 下载失败（exit $LASTEXITCODE）" }
          if ((Get-Item image.esd).Length -lt 100MB) { Write-Error "ESD 下载异常（$((Get-Item image.esd).Length) 字节）" }
          "ESD 大小: $([math]::Round((Get-Item image.esd).Length / 1GB, 2)) GiB，耗时 $([int]$sw.Elapsed.TotalSeconds)s"

      - name: 建测试盘（GPT + EFI + MSR + 主分区）
        shell: pwsh
        run: |
          # 用 diskpart 原生建 VHDX：qemu-img 建的盘会被 attach 以
          # "must be uncompressed...not be sparse" 拒收（runner D: 盘卷属性）。
          # 注意：convert gpt 会自动创建 MSR 分区，不要再手动 create partition msr。
          $diskpart = @"
          create vdisk file="$PWD\disk.vhdx" maximum=61440 type=expandable
          select vdisk file="$PWD\disk.vhdx"
          attach vdisk
          convert gpt
          create partition efi size=100
          format fs=fat32 label=System quick
          assign letter=Y
          create partition primary
          format fs=ntfs label=Windows quick
          assign letter=V
          "@
          $diskpart | diskpart.exe | Select-String -Pattern "successfully|error|percent|已成功|错误" | ForEach-Object { $_.Line.Trim() }
          if (-not (Test-Path "V:\") -or -not (Test-Path "Y:\")) { Write-Error "分区创建失败（V:/Y: 未就绪）" }
          "V: 可用 $([math]::Round((Get-Volume V).Size/1GB)) GiB / Y: 就绪"

      - name: 释放镜像（wimlib apply）
        shell: pwsh
        run: |
          # 先解析映像数：nightly ESD 是 capture 出来的单映像（只有索引1），
          # 多版本索引只存在于 MSUpdate 原版 ISO 的 install.esd
          $infoLines = & .\bin\wimlib-imagex.exe info image.esd 2>$null
          $imageCount = 0
          foreach ($l in $infoLines) { if ($l -match '^Image Count:\s*(\d+)') { $imageCount = [int]$Matches[1] } }
          "映像数: $imageCount"
          foreach ($l in $infoLines) { if ($l -match '^Name:') { "  $($l.Trim())" } }
          $idx = [int]"$env:IN_IMAGE_INDEX"
          if ($idx -gt $imageCount) {
            if ($imageCount -eq 1) {
              "::warning::指定的索引 $idx 超出范围（该 ESD 仅 1 个映像），自动回退索引 1"
              $idx = 1
            } else {
              Write-Error "索引 $idx 超出映像数 $imageCount"
            }
          }
          "使用映像索引: $idx"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process .\bin\wimlib-imagex.exe -ArgumentList @("apply", "image.esd", "$idx", "V:\") -PassThru -NoNewWindow
          while (-not $p.HasExited) { Start-Sleep 300; if (-not $p.HasExited) { "apply 进行中... $($sw.Elapsed.ToString('hh\:mm\:ss'))" } }
          if ($p.ExitCode -ne 0) { Write-Error "wimlib apply 失败（exit $($p.ExitCode)）" }
          "apply 完成，耗时 $($sw.Elapsed.ToString('hh\:mm\:ss'))"
          # ESD 5-8GB 用完即删：runner D: 盘空间紧张（疑为 0xBE/BCD 事故根因）
          $esdSize = [math]::Round((Get-Item image.esd).Length/1GB,2)
          Remove-Item image.esd -Force
          "已删 ESD 释放 ${esdSize}GB"
          Get-PSDrive -PSProvider FileSystem | ForEach-Object { "磁盘 $($_.Name): 剩余 $([math]::Round($_.Free/1GB,1))GB / 共 $([math]::Round(($_.Used+$_.Free)/1GB,1))GB" }

      - name: 写引导（bcdboot）
        shell: pwsh
        run: |
          # 优先用宿主 bcdboot：镜像内 bcdboot（28000）在 26100 宿主上报 BFSVC 错误；
          # 宿主 bootmgr 向后兼容加载新 OS 的 winload 是标准做法
          # 诊断标记：镜像里 bootmgfw_EX.efi 其实一直存在，bcdboot 报 0x3 是其内部
          # GLOBALROOT 设备路径解析问题——60 次重试是从外部无解的固有噪音（约 1 分钟，
          # 不影响引导，bootx64 回退路径一直正常）。此块仅探测留痕。
          $exDst = "V:\Windows\boot\EFI_EX\bootmgfw_EX.efi"
          if (Test-Path $exDst) { "补位跳过（$exDst 已存在，60 次重试为 bcdboot 固有噪音）" } else { "::warning::$exDst 不存在（罕见）" }
          if ("$env:IN_BCD_BOOT" -eq "image") {
            # 镜像自带 bcdboot：保证引导文件与镜像同源（宿主版本会混入宿主 EFI 文件）
            $bcd = "V:\Windows\System32\bcdboot.exe"
            if (-not (Test-Path $bcd)) { Write-Error "镜像内无 bcdboot.exe" }
          } else {
            $bcd = "C:\Windows\System32\bcdboot.exe"
            if (-not (Test-Path $bcd)) { $bcd = "V:\Windows\System32\bcdboot.exe" }
          }
          "使用: $bcd"
          & $bcd V:\Windows /s Y: /f UEFI /v
          if ($LASTEXITCODE -ne 0) { Write-Error "bcdboot 失败（exit $LASTEXITCODE）" }
          if ("$env:IN_ESP_NATIVE" -eq "true") {
            # 宿主 bcdboot 会把宿主版引导文件缝进 ESP；用镜像原生 EX 版覆盖，引导链全程镜像同源
            foreach ($map in @(
              @("V:\Windows\boot\EFI_EX\bootmgfw_EX.efi", "Y:\EFI\Microsoft\Boot\bootmgfw.efi"),
              @("V:\Windows\boot\EFI_EX\bootx64_EX.efi", "Y:\EFI\Boot\bootx64.efi")
            )) {
              if (Test-Path $map[0]) { Copy-Item $map[0] $map[1] -Force; "ESP 原生化: $($map[0]) → $($map[1])" }
              else { "::warning::ESP 原生化缺少源文件 $($map[0])" }
            }
          }
          Get-ChildItem Y:\EFI -Recurse -Filter "*.efi" | Select-Object -First 5 -ExpandProperty FullName

      - name: 校验引导（BCD + EFI 文件）
        shell: pwsh
        run: |
          # bcdboot 会"退出码 0 但产物不完整"（实测 BFSVC warning 0x3、
          # 或 LTSC 局打印成功却引导不了），必须硬校验后再交给 QEMU：
          # ① 三个关键文件齐全 ② BCD 存储可枚举且 default 指向 winload.efi
          $files = @(
            "Y:\EFI\Boot\bootx64.efi",
            "Y:\EFI\Microsoft\Boot\bootmgfw.efi",
            "Y:\EFI\Microsoft\Boot\BCD"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { Write-Error "引导校验失败：缺文件 $f" }
            "$f OK ($((Get-Item $f).Length) bytes)"
          }
          $enum = & bcdedit /store Y:\EFI\Microsoft\Boot\BCD /enum "{default}" 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Error "引导校验失败：bcdedit 无法枚举 BCD（exit $LASTEXITCODE）：$($enum -join ' ')" }
          $enum | ForEach-Object { "$_" }
          if (-not (($enum -join "`n") -match 'winload\.efi')) {
            Write-Error "引导校验失败：BCD default 项未指向 winload.efi（引导未真正创建）"
          }
          # 溯源：ESP 上的引导文件到底是镜像版还是宿主机版（MD5 三方对比）
          "── 引导文件溯源 ──"
          foreach ($f in @(
            "Y:\EFI\Microsoft\Boot\bootmgfw.efi", "Y:\EFI\Boot\bootx64.efi",
            "V:\Windows\boot\EFI_EX\bootmgfw_EX.efi", "V:\Windows\boot\EFI_EX\bootx64_EX.efi",
            "V:\Windows\boot\EFI\bootmgfw.efi", "C:\Windows\Boot\EFI\bootmgfw.efi"
          )) {
            if (Test-Path $f) { "$f = $((Get-FileHash $f -Algorithm MD5).Hash.Substring(0,16))" }
            else { "$f = 不存在" }
          }
          "── 引导校验通过 ──"

      - name: 卸载 VHDX
        shell: pwsh
        run: |
          @"
          select vdisk file="$PWD\disk.vhdx"
          detach vdisk
          "@ | diskpart.exe | Out-Null
          "VHDX 已卸载，交给 QEMU"
          # qcow2 模式：建盘/释放走 Windows 原生工具，开 QEMU 前转成 QEMU 原生格式
          if ("$env:IN_DISK" -eq "qcow2") {
            $qemuImg = Join-Path (Split-Path (Get-Command qemu-system-x86_64.exe).Source) "qemu-img.exe"
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            & $qemuImg convert -f vhdx -O qcow2 -p disk.vhdx disk.qcow2
            if ($LASTEXITCODE -ne 0) { Write-Error "VHDX→qcow2 转换失败（exit $LASTEXITCODE）" }
            Remove-Item disk.vhdx -Force
            "已转 qcow2 并删除 VHDX，耗时 $([int]$sw.Elapsed.TotalSeconds)s，大小 $([math]::Round((Get-Item disk.qcow2).Length/1GB,2))GB"
          }

      - name: QEMU 开机 + 每 3 秒截图
        shell: pwsh
        run: |
          $qemuDir = Split-Path (Get-Command qemu-system-x86_64.exe).Source
          $edk2 = Get-ChildItem $qemuDir -Recurse -Filter "edk2-x86_64-code.fd" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $edk2) { Write-Error "未找到 edk2-x86_64-code.fd 固件" }
          "固件: $edk2"
          New-Item -ItemType Directory shots | Out-Null
          # 整串传参并内嵌引号：路径含空格（C:\Program Files）时数组参数会被拆散
          $diskFile = if ("$env:IN_DISK" -eq "qcow2") { "disk.qcow2" } else { "disk.vhdx" }
          $diskFmt = if ("$env:IN_DISK" -eq "qcow2") { "qcow2" } else { "vhdx" }
          $argString = "-machine $env:IN_MACHINE -accel $env:IN_ACCEL -m $env:IN_MEM_GBG -smp $env:IN_SMP " +
            "-drive `"file=$diskFile,format=$diskFmt,if=none,id=hd0`" "
          if ("$env:IN_MACHINE" -eq "q35") {
            $argString += "-device ahci,id=ahci0 -device ide-hd,drive=hd0,bus=ahci0.0 "
          } else {
            # i440fx(pc)：PIIX 老 IDE，Windows 自带驱动、QEMU 模拟最成熟
            $argString += "-device ide-hd,drive=hd0 "
          }
          $argString +=
            "-drive `"if=pflash,format=raw,readonly=on,file=$edk2`" " +
            "-display none -qmp tcp:127.0.0.1:4444,server,nowait"
          if ("$env:IN_NIC" -ne "none") {
            $argString += " -netdev user,id=n0 -device $env:IN_NIC,netdev=n0"
          }
          $cpuModel = "$env:IN_CPU_MODEL".Trim()
          if ($cpuModel) { $argString += " -cpu $cpuModel" }
          "QEMU 参数: $argString"
          # 客户机部署流程收尾会自动重启（TCG 长跑实测）。WHPX 后端恰好在客户机
          # 重置路径上崩（xsave / VP exit 4，实测崩溃时点=桌面阶段结束转黑瞬间），
          # 所以加 -no-reboot：客户机一重启 QEMU 就干净退出，外层重新拉起二_boot。
          $argString += " -no-reboot"
          $limit = (Get-Date).AddMinutes($env:IN_RUN_MINUTES)
          $t0 = Get-Date
          # 循环检测记账：主画面哈希 → 该画面作为"稳定期"出现的次数
          $periodCounts = @{}
          $periodLen = 0
          $i = 0; $kept = 0; $verdict = "timeout"
          $lastMain = $null; $lastBand = $null; $mainSame = 0; $bandTickInStable = $false
          $maxRounds = [int]"$env:IN_BOOT_ROUNDS"
          for ($bootRound = 1; $bootRound -le $maxRounds -and $verdict -eq "timeout"; $bootRound++) {
            # 每轮重置判定状态：跨重启不重置会让 loop 计数累加（不同轮次的同画面误判 loop）、
            # 或让 mainSame 从上一轮高位续算（重启瞬间误判 desktop/frozen）
            $periodCounts = @{}
            $periodLen = 0
            $lastMain = $null; $lastBand = $null; $mainSame = 0; $bandTickInStable = $false
            $stderrFile = "qemu-stderr-$bootRound.log"
            $p = Start-Process qemu-system-x86_64.exe -ArgumentList $argString -PassThru -NoNewWindow -RedirectStandardError $stderrFile
            Start-Sleep -Seconds 8
            if ($p.HasExited) {
              # WHPX 初始化偶发秒退（stderr 仅特性警告无致命行，实测 40194518266）：重试一次
              "::warning::第 $bootRound 次启动 8 秒内退出（exit $($p.ExitCode)），15 秒后重试"
              Get-Content $stderrFile -ErrorAction SilentlyContinue | Select-Object -Last 6
              Start-Sleep -Seconds 15
              $p = Start-Process qemu-system-x86_64.exe -ArgumentList $argString -PassThru -NoNewWindow -RedirectStandardError $stderrFile
              Start-Sleep -Seconds 8
            }
            if ($p.HasExited) {
              "第 $bootRound 次启动重试后仍秒退，stderr："
              Get-Content $stderrFile -ErrorAction SilentlyContinue | Select-Object -First 10
              Write-Error "QEMU 未能启动"
            }
            $roundStart = Get-Date
            $roundSawShutdown = $false; $roundSawReset = $false
            $el = $roundStart - $t0
            "── 第 $bootRound 次开机，PID $($p.Id)，$($roundStart.ToString('HH:mm:ss'))（累计 $([int]$el.TotalMinutes)分$([int]$el.Seconds)秒），D: 剩余 $([math]::Round((Get-PSDrive D).Free/1GB,1))GB ──"
            # QMP 连接重试：QEMU 偶发启动后数秒即死（WHPX 抽风），裸连会抛异常掀翻步骤
            $client = $null
            foreach ($try in 1..5) {
              try { $client = New-Object System.Net.Sockets.TcpClient('127.0.0.1', 4444); break } catch { Start-Sleep -Seconds 3 }
            }
            if (-not $client) {
              "::warning::第 $bootRound 次开机 QMP 连不上（QEMU 可能启动后即死），按本轮失败处理"
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
              continue
            }
            $stream = $client.GetStream()
            $reader = New-Object System.IO.StreamReader($stream)
            $writer = New-Object System.IO.StreamWriter($stream); $writer.AutoFlush = $true
            $null = $reader.ReadLine()                                    # greeting
            $writer.WriteLine('{"execute":"qmp_capabilities"}'); $null = $reader.ReadLine()

          function Wait-QmpReturn($reader) {
            $deadline = (Get-Date).AddSeconds(15)
            while ((Get-Date) -lt $deadline) {
              $line = $reader.ReadLine()
              if ($null -eq $line) { return $false }
              # QMP 异步事件与命令返回共用一条流，顺手记账
              if ($line -match '"event":\s*"SHUTDOWN"') { $script:roundSawShutdown = $true }
              if ($line -match '"event":\s*"RESET"') { $script:roundSawReset = $true }
              if ($line -match '"return"') { return $true }
              if ($line -match '"error"') { Write-Host "QMP 错误: $line"; return $false }
            }
            return $false
          }

          # 双区域判定：主画面（去掉任务栏条的上部）静止 + 右下角时钟区（角落矩形）在
          # 稳定期跳变 → 判"桌面空闲"；主画面静止但角落也死寂 → 判"卡死"。
          # 分区依据实测（shot-0125 量得）：任务栏顶 y=753 高 47px，时钟右下角右对齐。
          # 用角落而非全宽底条：固件加载转圈在底部居中，全宽会把它误判成时钟走动。
          # PPM(P6) 头部逐 token 解析后对两个区域分别取 MD5。
          function Get-PpmHashes([string]$path) {
            $bytes = [IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 16 -or $bytes[0] -ne 0x50 -or $bytes[1] -ne 0x36) { return $null }
            $nums = @(); $tok = ''; $state = 0; $i = 2
            for (; $i -lt 128 -and $state -lt 3; $i++) {
              $c = $bytes[$i]
              if ($c -eq 32 -or $c -eq 10 -or $c -eq 13 -or $c -eq 9) {
                if ($tok) { $nums += [int]$tok; $tok = ''; $state++ }
              } else { $tok += [char]$c }
            }
            if ($nums.Count -lt 2) { return $null }
            $rowBytes = $nums[0] * 3
            $stripRows = 56        # 任务栏条高（47px 实测 + 余量）
            $cornerPx = 300        # 右下角时钟区宽
            # 维度守卫：早期固件/文本模式截图可能远小于此（如 640x480），越界会让
            # Array.Copy 负偏移抛异常掀翻整个步骤（实测未遇，但必须兜住）
            if ($nums[0] -lt ($cornerPx + 1) -or $nums[1] -le ($stripRows + 1)) { return $null }
            $mainEnd = $i + ($nums[1] - $stripRows) * $rowBytes
            if ($mainEnd -ge $bytes.Length) { return $null }
            $md5 = [Security.Cryptography.MD5]::Create()
            $main = [BitConverter]::ToString($md5.ComputeHash($bytes, $i, $mainEnd - $i))
            $xStart = ($nums[0] - $cornerPx) * 3
            $bandArr = New-Object byte[] ($stripRows * $cornerPx * 3)
            $pos = 0
            for ($r = 0; $r -lt $stripRows; $r++) {
              [Array]::Copy($bytes, ($mainEnd + $r * $rowBytes + $xStart), $bandArr, $pos, ($cornerPx * 3))
              $pos += $cornerPx * 3
            }
            $band = [BitConverter]::ToString($md5.ComputeHash($bandArr))
            return "$main|$band"
          }

          while ((Get-Date) -lt $limit -and -not $p.HasExited) {
            $i++
            # 吸收 QMP 异步事件（SHUTDOWN=客户机关机、RESET=客户机重启）：
            # 事件可能在 3 秒睡眠期间到达，每轮截图前清一次缓冲
            while ($stream.DataAvailable) {
              $ev = $reader.ReadLine()
              if ($null -eq $ev) { break }
              if ($ev -match '"event":\s*"SHUTDOWN"') { $roundSawShutdown = $true }
              if ($ev -match '"event":\s*"RESET"') { $roundSawReset = $true }
            }
            $shot = "shot-{0:d4}.ppm" -f $i
            $writer.WriteLine('{"execute":"screendump","arguments":{"filename":"' + $shot + '"}}')
            if (Wait-QmpReturn $reader) {
              # 哈希解析任何异常都按"无效截图"跳过，绝不掀翻判定步骤
              $hashes = $null
              try { $hashes = Get-PpmHashes $shot } catch { "::warning::截图解析失败（$($_.Exception.Message)），跳过该帧" }
              if ($hashes) {
                $main, $band = $hashes.Split('|')
                # 去重保留：主画面变了才进 artifact；每 100 张强留一张做时间轴
                if (($main -ne $lastMain) -or ($i % 100 -eq 0)) {
                  Move-Item $shot "shots\$shot" -Force; $kept++
                } else {
                  Remove-Item $shot -Force -ErrorAction SilentlyContinue
                }
                # 时钟跳变必须发生在"主画面已稳定期间"（null→首值的跳变不算）。
                # frozen 放宽到 300 秒：部署长尾统计数字偶有 2 分钟不动，150 秒会误杀绿局
                if ($main -eq $lastMain) {
                  $mainSame++
                  $periodLen++
                  if ($band -ne $lastBand) { $bandTickInStable = $true }
                } else {
                  # 循环检测：一次"稳定期"（连续 >=3 帧不变）结束后记账；同一画面
                  # 第 8 次成期 = 系统在同一组画面里打转（蓝屏进度循环/错误页自动
                  # 重试），即"会动的尸体"，判红。要求稳定期 >=3 帧是为了排除
                  # 光标闪烁这类高频抖动（它们每期只有 1 帧）
                  if ($lastMain -and $periodLen -ge 3) {
                    if (-not $periodCounts.ContainsKey($lastMain)) { $periodCounts[$lastMain] = 0 }
                    $periodCounts[$lastMain]++
                    if ($periodCounts[$lastMain] -ge 8) { $verdict = "loop"; break }
                  }
                  $mainSame = 0; $bandTickInStable = $false; $periodLen = 1
                }
                $lastMain = $main; $lastBand = $band
                if ($mainSame -ge 10 -and $bandTickInStable) { $verdict = "desktop"; break }
                if ($mainSame -ge 100 -and -not $bandTickInStable) { $verdict = "frozen"; break }
              } else {
                Remove-Item $shot -Force -ErrorAction SilentlyContinue
              }
            }
            Start-Sleep -Seconds 3
            if ($i % 50 -eq 0) {
              "$(Get-Date -Format 'HH:mm:ss') 已截 $i 张（保留 $kept），第 $bootRound 次开机中，D: 剩余 $([math]::Round((Get-PSDrive D).Free/1GB,1))GB"
            }
          }
            if ($p.HasExited) {
              $dur = (Get-Date) - $roundStart
              if ($roundSawShutdown) {
                # SHUTDOWN（guest 发起的关机）= 镜像部署脚本按设计收尾，判 deployed 绿
                "第 $bootRound 次开机以客户机关机收尾（历时 $([int]$dur.TotalMinutes) 分 $([int]$dur.Seconds) 秒）——部署流程按设计完成"
                $verdict = "deployed"
              } else {
                "第 $bootRound 次开机结束：历时 $([int]$dur.TotalMinutes) 分 $([int]$dur.Seconds) 秒（客户机重启/关机，QEMU 已退出 exit $($p.ExitCode)，$((Get-Date).ToString('HH:mm:ss'))）"
              }
            }
            $client.Close()
            if ($verdict -ne "timeout" -or (Get-Date) -ge $limit) { break }
            if ($bootRound -lt $maxRounds) { "5 秒后重新拉起 QEMU 进行下一次开机..." }
            Start-Sleep -Seconds 5
          }
          $total = (Get-Date) - $t0
          "截图 $i 张，保留 $kept 张，判定: $verdict，总历时 $([int]$total.TotalMinutes) 分 $([int]$total.Seconds) 秒"
          "verdict=$verdict" | Out-File verdict.txt -Encoding utf8
          if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          "── qemu stderr 末尾（最新一轮） ──"
          $latestLog = Get-ChildItem qemu-stderr-*.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($latestLog) { "$($latestLog.Name)："; Get-Content $latestLog.FullName -Tail 8 }
          if ($verdict -eq "frozen") { Write-Error "判定为卡死（主画面与时钟带均静止），开机失败" }
          if ($verdict -eq "loop") { Write-Error "判定为循环（同一组画面反复出现，疑似蓝屏进度循环或错误页自动重试），开机失败" }
          if ($verdict -eq "timeout" -and $kept -eq 0) { Write-Error "超时且无任何截图，开机失败" }
          # 等被杀的 QEMU 真正退出（大 VHDX 写回缓存冲刷可达数十秒），否则取证挂载必失败
          if ($p -and -not $p.HasExited) { Wait-Process -Id $p.Id -Timeout 90 -ErrorAction SilentlyContinue }

      - name: 绿局转视频（H.265，5fps，去重帧）
        id: video
        if: success()
        shell: pwsh
        run: |
          # 仅绿局：去重保留的截图转 H.265 MP4（5fps、低码率、慢preset高压缩）。
          # 只取 1280x800 帧——小分辨率是机器未起来时的早期截图，全部丢弃。
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress | Out-Null
          }
          "ffmpeg: $((ffmpeg -version 2>$null | Select-Object -First 1))"
          function Get-PpmSize([string]$path) {
            $fs = [IO.File]::OpenRead($path)
            $buf = New-Object byte[] 64
            $null = $fs.Read($buf, 0, 64); $fs.Close()
            $s = [Text.Encoding]::ASCII.GetString($buf)
            if ($s -notmatch '^P6\s+(\d+)\s+(\d+)') { return $null }
            return @{ w = [int]$Matches[1]; h = [int]$Matches[2] }
          }
          $listFile = "shots\concat.txt"
          Remove-Item $listFile -ErrorAction SilentlyContinue
          $used = 0; $skipped = 0; $lastName = $null
          foreach ($f in (Get-ChildItem shots\shot-*.ppm | Sort-Object Name)) {
            try {
              $sz = Get-PpmSize $f.FullName
              if ($sz -and $sz.w -eq 1280 -and $sz.h -eq 800) {
                # concat demuxer 对图片默认时长为零（375 帧全挤 t=0，实测"闪一下就没了"）：
                # 每帧显式 duration 0.2s；末帧再列一次，否则其 duration 不生效（demuxer 已知怪癖）
                Add-Content $listFile "file '$($f.Name)'"
                Add-Content $listFile "duration 0.2"
                $lastName = $f.Name; $used++
              } else { $skipped++ }
            } catch { $skipped++ }
          }
          "入选 $used 帧，丢弃非 1280x800 帧 $skipped 张"
          if ($used -eq 0) { "::warning::没有 1280x800 帧，跳过视频生成"; exit 0 }
          if ($lastName) { Add-Content $listFile "file '$lastName'" }
          # 视频名带镜像文件名：EEEOS_xxx_2026.07.22_28000.2525_测试视频.mp4
          $esdName = [IO.Path]::GetFileNameWithoutExtension("${{ steps.resolve.outputs.esd_name }}")
          if (-not $esdName) { $esdName = "unknown" }
          $videoName = "${esdName}_测试视频.mp4"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 -i $listFile `
            -r 5 -c:v libx265 -preset slow -crf 30 -pix_fmt yuv420p -tag:v hvc1 $videoName
          if ($LASTEXITCODE -ne 0) { "::warning::ffmpeg 编码失败（exit $LASTEXITCODE），不影响判定" }
          elseif (Test-Path $videoName) {
            $dur = & ffprobe -v error -show_entries format=duration -of csv=p=0 $videoName 2>$null
            "$videoName 生成：$([math]::Round((Get-Item $videoName).Length/1MB,2))MB，ffprobe 实测时长 ${dur}s（期望 ~$([math]::Round($used/5,1))s），耗时 $([int]$sw.Elapsed.TotalSeconds)s"
            "video_name=$videoName" >> $env:GITHUB_OUTPUT
          }

      - name: 获取 rclone 配置与二进制（私有仓）
        if: success() && env.IN_USE_LATEST == 'true'
        uses: actions/checkout@v6
        with:
          repository: yukaidi1220/rclone-action
          token: ${{ secrets.RCLONE_TOKEN }}
          path: rclone-bin

      - name: 上传测试视频到网盘（供 EEEOS-GET 前端取用）
        id: upload_video
        if: success() && env.IN_USE_LATEST == 'true'
        shell: pwsh
        run: |
          # 视频随镜像一起发布：与 ESD 同目录（Nightly/<构建日期>/）。
          # 注意该目录受 cleanup-builds 版本保留管理（30天/最近3个目录/指针引用保护）
          $esdUrl = "${{ steps.resolve.outputs.esd_url }}"
          $videoName = "${{ steps.video.outputs.video_name }}"
          if (-not $esdUrl -or -not $videoName -or -not (Test-Path $videoName)) { "::warning::无 ESD 地址或视频文件，跳过上传"; exit 0 }
          Invoke-WebRequest -Uri "https://github.com/yukaidi1220/rclone/releases/latest/download/rclone-cdn-windows-amd64.exe" -OutFile rclone-bin\rclone.exe
          $conf = "rclone-bin\rclone.conf"
          if (-not (Test-Path $conf)) { "::warning::私有仓无 rclone.conf，跳过视频上传"; exit 0 }
          # ESD 形如 https://res.yukaidi.top/d/cr/qzy-hk/System/Nightly/2026.07.22/x.esd
          # → cloudreve:/File/System/Nightly/2026.07.22/（注意 web 路径含 /d/cr/qzy-hk，
          #   存储路径是 /File/System/...，两者前缀不同，必须按 System/Nightly 段解析）
          $esdPath = ([Uri]$esdUrl).AbsolutePath
          if ($esdPath -match '/System/Nightly/([^/]+)/') { $remoteDir = "File/System/Nightly/$($Matches[1])" }
          else { "::warning::无法从 ESD 路径解析 Nightly 日期: $esdPath"; exit 0 }
          "上传 $videoName → cloudreve:/$remoteDir/"
          & rclone-bin\rclone.exe copy $videoName "cloudreve:/$remoteDir/" --config $conf --progress
          if ($LASTEXITCODE -ne 0) { "::warning::视频上传失败（exit $LASTEXITCODE）" }
          else {
            "视频已上传: cloudreve:/$remoteDir/$videoName"
            "video_url=$esdUrl" >> $env:GITHUB_OUTPUT
          }

      - name: 赛后取证（minidump / Panther / 事件日志）
        if: always()
        shell: pwsh
        run: |
          # 重挂测试盘拷出系统内证据：蓝屏 minidump、部署日志、事件日志。
          # 注意：here-string 收尾 "@ 必须顶格（缩进会导致 ParserError，实测踩过）
          # 取证 = best-effort：整体 try/catch 永不掀翻步骤（盘符乱值曾炸 Join-Path、Set-Partition 也炸过）
          # qcow2 模式取证：转回 VHDX 副本再挂载（diskpart 只认 VHDX）。
          # 必须 fixed 预分配子格式——qemu-img 默认产物是稀疏文件，diskpart 拒挂（QEMU#136，实测 M1/M3 三连败）
          $vfile = "disk.vhdx"
          if ("$env:IN_DISK" -eq "qcow2" -and (Test-Path disk.qcow2)) {
            $qemuImg2 = Join-Path (Split-Path (Get-Command qemu-system-x86_64.exe).Source) "qemu-img.exe"
            $sw2 = [System.Diagnostics.Stopwatch]::StartNew()
            & $qemuImg2 convert -f qcow2 -O vhdx -o subformat=fixed disk.qcow2 forensic.vhdx 2>&1 | Out-Null
            if (Test-Path forensic.vhdx) {
              # qemu-img 在 Windows 上一律给产物打 NTFS 稀疏属性，runner 的虚拟磁盘栈
              # 拒挂（实测报错原文 "...must not be sparse"，本地机器宽容所以只能 CI 验）。
              # fsutil 秒清；清不掉就顺序重写稠密化兜底
              fsutil sparse setflag forensic.vhdx 0 | Out-Null
              if ((Get-Item forensic.vhdx).Attributes -band [IO.FileAttributes]::SparseFile) {
                "fsutil 清稀疏失败，顺序重写稠密化（约 2 分钟）..."
                $inStream = [IO.File]::OpenRead("$PWD\forensic.vhdx")
                $outStream = [IO.File]::Open("$PWD\forensic-dense.vhdx", 'Create', 'Write')
                $buf = New-Object byte[] 8388608
                while (($n = $inStream.Read($buf, 0, $buf.Length)) -gt 0) { $outStream.Write($buf, 0, $n) }
                $outStream.Close(); $inStream.Close()
                Remove-Item forensic.vhdx -Force
                Rename-Item forensic-dense.vhdx forensic.vhdx
              }
              "取证副本稀疏属性: $((Get-Item forensic.vhdx).Attributes)"
              $vfile = "forensic.vhdx"
            } else { "取证副本转换失败" }
          }
          $attach = @"
          select vdisk file="$PWD\$vfile"
          attach vdisk
          "@
          $detach = @"
          select vdisk file="$PWD\$vfile"
          detach vdisk
          "@
          try {
            # QEMU 刚被 Stop-Process、文件句柄可能未释放：先清残留进程，挂载失败重试 3 次。
            # diskpart 输出必须留痕（fixed VHDX 被拒时要知道具体原因），失败后再用
            # Mount-DiskImage（挂载栈不同）兜底
            Get-Process qemu-system-x86_64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            $attached = $false
            foreach ($try in 1..3) {
              $dpOut = $attach | diskpart.exe 2>&1 | Out-String
              Start-Sleep -Seconds 6
              if (Get-Disk | Where-Object { $_.BusType -eq 'File Backed Virtual' }) { $attached = $true; break }
              "第 $try 次挂载后未见 VHDX 磁盘，diskpart 输出："
              ($dpOut -split "`r?`n" | Where-Object { $_ -match '\S' -and $_ -notmatch '^Microsoft|^Copyright|DISKPART>' }) -join "`n"
              Start-Sleep -Seconds 3
            }
            if (-not $attached) {
              "diskpart 三连败，改用 Mount-DiskImage 兜底..."
              try {
                Mount-DiskImage -ImagePath "$PWD\$vfile" -ErrorAction Stop | Out-Null
                Start-Sleep -Seconds 6
                if (Get-Disk | Where-Object { $_.BusType -eq 'File Backed Virtual' -or ($_.BusType -eq 'Unknown' -and (Get-DiskImage -ImagePath "$PWD\$vfile").Attached) }) { $attached = $true; "Mount-DiskImage 挂载成功" }
              } catch { "Mount-DiskImage 也失败: $($_.Exception.Message)" }
            }
            if (-not $attached) { "取证跳过：VHDX 挂载失败（句柄占用或盘异常）" }
            $vdiskDisk = Get-Disk | Where-Object { $_.BusType -eq 'File Backed Virtual' } | Select-Object -First 1
            $Y = $null; $V = $null
            if ($vdiskDisk) {
              $espPart = Get-Partition -DiskNumber $vdiskDisk.Number | Where-Object { $_.Type -eq 'System' } | Select-Object -First 1
              $osPart  = Get-Partition -DiskNumber $vdiskDisk.Number | Where-Object { $_.Type -eq 'Basic' } | Select-Object -First 1
              # 盘符解析：自带号→Test-Path 校验；无效→赋号；失败→挂目录；返回前全部校验
              function Resolve-Letter($part, $want) {
                $l = $null
                try { $c = "$($part.DriveLetter)".Trim(); if ($c -match '^[A-Z]$') { $l = "${c}:" } } catch {}
                if ($l -and (Test-Path $l)) { return $l }
                try {
                  Set-Partition -DiskNumber $part.DiskNumber -PartitionNumber $part.PartitionNumber -NewDriveLetter $want -ErrorAction Stop
                  if (Test-Path "${want}:") { return "${want}:" }
                } catch {}
                try {
                  $mnt = Join-Path $PWD "$($want.ToLower())-mnt"
                  New-Item -ItemType Directory $mnt -Force | Out-Null
                  Add-PartitionAccessPath -DiskNumber $part.DiskNumber -PartitionNumber $part.PartitionNumber -AccessPath $mnt -ErrorAction Stop
                  return $mnt
                } catch {}
                return $null
              }
              if ($espPart) { $Y = Resolve-Letter $espPart 'Y' }
              if ($osPart) { $V = Resolve-Letter $osPart 'V' }
            } else { "取证跳过：重挂后找不到 VHDX 磁盘" }
            "ESP 路径: $Y ; OS 路径: $V"
            New-Item -ItemType Directory forensics -ErrorAction Ignore | Out-Null
            if ($Y) {
              try {
                $bcdPath = Join-Path $Y "EFI\Microsoft\Boot\BCD"
                if (Test-Path $bcdPath) { & bcdedit /store $bcdPath /enum all 2>&1 | Out-File forensics\bcd-enum.txt -Encoding utf8; "BCD 枚举已存" }
                else { "BCD 不存在: $bcdPath" | Out-File forensics\bcd-enum.txt -Encoding utf8 }
              } catch { "BCD 枚举失败: $($_.Exception.Message)" }
            }
            if ($V) {
              foreach ($s in @("$V\Windows\Minidump", "$V\Windows\MEMORY.DMP", "$V\Windows\Panther", "$V\Windows\System32\winevt\Logs\System.evtx", "$V\Windows\System32\winevt\Logs\Application.evtx", "$V\Windows\bootstat.dat")) {
                try {
                  if (Test-Path $s) {
                    $item = Get-Item $s
                    if ($item.PSIsContainer -or $item.Length -lt 800MB) { Copy-Item $s forensics\ -Recurse -Force -ErrorAction SilentlyContinue; "取证: $s" }
                    else { "跳过大文件: $s ($([math]::Round($item.Length/1MB))MB)" }
                  }
                } catch { "取证 $s 失败: $($_.Exception.Message)" }
              }
            } else { "取证跳过：Windows 卷不可访问" }
            "── 取证清单 ──"
            Get-ChildItem forensics -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length/1KB))KB" }
          } catch {
            "取证整体异常（不影响判定）: $($_.Exception.Message)"
          } finally {
            try { $detach | diskpart.exe | Out-Null } catch {}
            try { Dismount-DiskImage -ImagePath "$PWD\$vfile" -ErrorAction Stop | Out-Null } catch {}
          }

      - name: 打包上传（视频，单独 artifact，名带镜像名+run id）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve.outputs.esd_name }}_测试视频_a${{ matrix.attempt }}_${{ github.run_id }}
          path: ${{ steps.video.outputs.video_name }}
          retention-days: 7
          if-no-files-found: warn

      - name: 打包上传（截图/日志/取证，名带镜像名+run id）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve.outputs.esd_name }}_shots_a${{ matrix.attempt }}_${{ github.run_id }}
          path: |
            shots/
            qemu-stderr-*.log
            verdict.txt
            forensics/
          retention-days: 7
          if-no-files-found: warn
